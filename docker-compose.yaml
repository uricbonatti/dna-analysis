services:
  api:
    build: .
    container_name: dna-analysis-api
    ports:
      - "8000:8000"
    environment:
      DB_URL: mongodb://mongodb:27017
    volumes:
      - dna-analysis-logs:/app/logs
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    container_name: dna-analysis-db
    volumes:
      - dna-analysis-data:/data/db

volumes:
  dna-analysis-logs:
  dna-analysis-data:
